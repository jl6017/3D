<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Magic Window</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- Import Map for Three.js ES Modules -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

</head>
<body>
    <!-- Main 3D canvas container -->
    <div id="canvas-container"></div>

    <!-- Hidden video element for webcam -->
    <video id="webcam" autoplay playsinline></video>

    <!-- Mode selection overlay -->
    <div id="mode-overlay">
        <div id="mode-selection">
            <h1>3D Magic Window</h1>
            <p>Choose your interaction mode:</p>
            <div class="mode-buttons">
                <button id="btn-mouse" class="mode-button">
                    <span class="mode-icon">🖱️</span>
                    <span class="mode-title">Mouse Mode</span>
                    <span class="mode-desc">Control view with mouse movement</span>
                </button>
                <button id="btn-webcam" class="mode-button">
                    <span class="mode-icon">📷</span>
                    <span class="mode-title">Face Tracking</span>
                    <span class="mode-desc">Use webcam to track head position</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Status overlay -->
    <div id="status-overlay" class="hidden">
        <div id="status-text">Initializing...</div>
    </div>

    <!-- Debug info (optional) -->
    <div id="debug-info"></div>

    <!-- Back button -->
    <button id="btn-back" class="back-button hidden">← Back</button>

    <!-- Main application script -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
